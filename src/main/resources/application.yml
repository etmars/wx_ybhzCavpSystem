server:
  # 本机 HTTP；生产 profile 同样 12380，对外 HTTPS 由 Nginx 反代
  port: 12380

spring:
  application:
    name: wx-ybhz-cavp-system
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  data-dir: ${DATA_DIR:./data}
  # 默认关闭；地图从 parkinglot catalog + 标定服同步到 data/maps（缓存）
  sync-osmandroid-assets: ${SYNC_OSMANDROID_ASSETS:false}
  osmandroid-assets: ${OSMANDROID_ASSETS:}
  map-sync:
    enabled: ${MAP_SYNC_ENABLED:true}
    on-startup: ${MAP_SYNC_ON_STARTUP:true}
  parking:
    nearby-lng: 116.491829413
    nearby-lat: 39.729580309
    nearby-radius: 15000
    default-parking-id: "000002"
    vehicle-id: I1000110
    parking-space-number: B117
    parking-lng: 116.4915732
    parking-lat: 39.7305491
    # 与 cavp.env 的 PARKING_API_BASE_URL 对齐；不要再用 :3000
    api-base-url: ${PARKING_API_BASE_URL:https://parkinglot.c-avp.com:3050}
  calib:
    # 与 cavp.env 的 CALIB_API_BASE_URL 对齐。parkinglock:18181 已废弃，资产在 18231
    api-base-url: ${CALIB_API_BASE_URL:https://parkinglot.c-avp.com:18231}
  navigation:
    arrival-meters: 8.0
    walk-speed-mps: 1.15
  planner:
    base-url: ${PLANNER_BASE_URL:http://127.0.0.1:18080}
  walk-planner:
    base-url: ${WALK_PLANNER_BASE_URL:http://127.0.0.1:18090}
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}
    enabled: ${MQTT_ENABLED:false}
  config:
    db-path: ${CONFIG_DB_PATH:data/config.db}

logging:
  level:
    com.ybhzcavp: INFO
